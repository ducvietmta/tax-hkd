name = "tax-agent-worker"
main = "src/index.ts"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]

[placement]
region = "aws:us-east-1"

[[d1_databases]]
binding = "DB"
database_name = "tax_db"
database_id = "540ddea4-8da6-4957-bd5b-3959483d269f"

[triggers]
crons = ["0 3 * * *"]

[vars]
ENVIRONMENT = "production"
APP_NAME = "Hệ thống Tư vấn Thuế TMĐT & HKD 2026"
CORS_ALLOW_ORIGIN = "https://tax-hkd.pages.dev"
INITIAL_FREE_CREDITS = 3
VIP_CREDITS = 1000
SEPAY_PATTERN = "SP-LIVE-TD295786"
DECISION_MODE = "audit"
MUSE_MODEL = "deepseek/deepseek-v4.1-flash"
VECTORIZE_ENABLED = "1"
# Secrets — KHÔNG commit giá trị thật vào git. Cấu hình bằng:
#   wrangler secret put MUSE_API_KEY
#   wrangler secret put JEV_API_KEY
#   wrangler secret put FPT_AI_KEY
#   wrangler secret put SEPAY_API_KEY
#   (tùy chọn) wrangler secret put VIP_PHONE
# Đọc trong code qua env.MUSE_API_KEY / env.JEV_API_KEY / env.FPT_AI_KEY / env.SEPAY_API_KEY / env.VIP_PHONE.

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "tax-kb-v1"
