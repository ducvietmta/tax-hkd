name = "tax-agent-worker"
main = "src/index.ts"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]

[placement]
region = "aws:us-east-1"

[[d1_databases]]
binding = "DB"
database_name = "tax_db"
database_id = "540ddea4-8da6-4957-bd5b-3959483d269f"

[triggers]
crons = ["0 3 * * *"]

[vars]
ENVIRONMENT = "production"
APP_NAME = "Hệ thống Tư vấn Thuế TMĐT & HKD 2026"
CORS_ALLOW_ORIGIN = "https://tax-hkd.pages.dev"
INITIAL_FREE_CREDITS = 3
VIP_CREDITS = 1000
SEPAY_PATTERN = "SP-LIVE-TD295786"
DECISION_MODE = "enforce"
# VECTORIZE_ENABLED = "0"  # Bật "1" sau khi đã tạo index + nạp vectors (xem scripts/backfill_vectorize.mjs)
# Secrets — KHÔNG commit giá trị thật vào git. Cấu hình bằng:
#   wrangler secret put MUSE_API_KEY
#   wrangler secret put FPT_AI_KEY
#   wrangler secret put SEPAY_API_KEY
#   (tùy chọn) wrangler secret put VIP_PHONE
# Đọc trong code qua env.MUSE_API_KEY / env.FPT_AI_KEY / env.SEPAY_API_KEY / env.VIP_PHONE.

# DENSE RETRIEVAL OPT-IN (mặc định tắt — mở sau khi tạo Vectorize index):
# [ai]
# binding = "AI"
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "tax-kb-v1"
